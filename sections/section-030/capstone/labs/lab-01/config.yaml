# Fix A Keyless Policy That Trusts Too Much
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-123-capstone-030"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tools"
      description: "Installs Helm 3.22.1, the lab registry, the workstation tools, the signing key and Policy Controller v0.15.1"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-123-capstone-030-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Namespaces, the lab registry and the workstation pod."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation, the registry and the webhook answer"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-keyless-policy"
      description: "Confirms podinfo-release requires the podinfo release workflow identity from GitHub Actions, in enforce mode"
      type: "file"
      source: "validation/validate-keyless-policy.sh"
    - name: "validate-keyless-admission"
      description: "Confirms prod admits podinfo 6.10.0 and refuses the Flux source-controller image signed by another repository"
      type: "file"
      source: "validation/validate-keyless-admission.sh"
    - name: "validate-safe-settings"
      description: "Confirms the webhook still fails closed and images that match no policy are denied"
      type: "file"
      source: "validation/validate-safe-settings.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - registry:3.1.2
