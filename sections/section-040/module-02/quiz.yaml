# Knowledge check. Listed in astrona.yaml as a `type: quiz` entry.
schema_version: 1
kind: question_bank
id: ats123-040-02
course_id: ATS123
exam_code: SIGSTORE
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: module-02
  title: "Custom Attestations And Policy Languages"
placement:
  position: after
  reading: sections/section-040/module-02/course-05-summary.md
questions:
- id: ats123-040-02-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Attach a custom statement"
  source_readings:
  - sections/section-040/module-02/course-01-custom-predicates-and-statements.md
  prompt: "Which flag of cosign attest sets the kind of a custom statement?"
  options:
  - id: a
    text: "--type"
    explanation: "Correct. --type takes a predicate type, which can be a URI."
  - id: b
    text: "--kind"
    explanation: "Not correct. --type takes a predicate type, which can be a URI."
  - id: c
    text: "--format"
    explanation: "Not correct. --type takes a predicate type, which can be a URI."
  - id: d
    text: "--predicate-kind"
    explanation: "Not correct. --type takes a predicate type, which can be a URI."
  correct_option: a
  explanation: "Correct. --type takes a predicate type, which can be a URI."
- id: ats123-040-02-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: "Choose a type URI"
  source_readings:
  - sections/section-040/module-02/course-01-custom-predicates-and-statements.md
  prompt: "What should a custom predicate type be?"
  options:
  - id: a
    text: "A URI that your organisation controls and versions"
    explanation: "Correct. A controlled URI avoids clashes and lets you change the format by version."
  - id: b
    text: "Any short word"
    explanation: "Not correct. A controlled URI avoids clashes and lets you change the format by version."
  - id: c
    text: "The image name"
    explanation: "Not correct. A controlled URI avoids clashes and lets you change the format by version."
  - id: d
    text: "A random string"
    explanation: "Not correct. A controlled URI avoids clashes and lets you change the format by version."
  correct_option: a
  explanation: "Correct. A controlled URI avoids clashes and lets you change the format by version."
- id: ats123-040-02-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know what the policy sees"
  source_readings:
  - sections/section-040/module-02/course-01-custom-predicates-and-statements.md
  prompt: "What does a policy receive for an attestation?"
  options:
  - id: a
    text: "The decoded statement with predicateType and predicate at the top level"
    explanation: "Correct. The policy is evaluated against the verified statement."
  - id: b
    text: "The raw image layers"
    explanation: "Not correct. The policy is evaluated against the verified statement."
  - id: c
    text: "The signature bytes"
    explanation: "Not correct. The policy is evaluated against the verified statement."
  - id: d
    text: "The Kubernetes pod"
    explanation: "Not correct. The policy is evaluated against the verified statement."
  correct_option: a
  explanation: "Correct. The policy is evaluated against the verified statement."
- id: ats123-040-02-q04
  type: single_choice
  difficulty: beginner
  learning_objective: "Use CUE for requirements"
  source_readings:
  - sections/section-040/module-02/course-02-writing-cue-policies.md
  prompt: "How does CUE treat fields that the policy does not mention?"
  options:
  - id: a
    text: "It ignores them"
    explanation: "Correct. CUE states what must be present."
  - id: b
    text: "It refuses the image"
    explanation: "Not correct. CUE states what must be present."
  - id: c
    text: "It deletes them"
    explanation: "Not correct. CUE states what must be present."
  - id: d
    text: "It requires them to be empty"
    explanation: "Not correct. CUE states what must be present."
  correct_option: a
  explanation: "Correct. CUE states what must be present."
- id: ats123-040-02-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: "Policy for a missing field"
  source_readings:
  - sections/section-040/module-02/course-02-writing-cue-policies.md
  prompt: "A CUE policy requires a field that the statement does not contain. What happens?"
  options:
  - id: a
    text: "Every image is refused"
    explanation: "Correct. A rule for a missing field cannot be satisfied."
  - id: b
    text: "Every image is admitted"
    explanation: "Not correct. A rule for a missing field cannot be satisfied."
  - id: c
    text: "The field is added"
    explanation: "Not correct. A rule for a missing field cannot be satisfied."
  - id: d
    text: "The policy is skipped"
    explanation: "Not correct. A rule for a missing field cannot be satisfied."
  correct_option: a
  explanation: "Correct. A rule for a missing field cannot be satisfied."
- id: ats123-040-02-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: "Rego package for the cluster"
  source_readings:
  - sections/section-040/module-02/course-03-writing-rego-policies.md
  prompt: "Which package and rule does a Rego policy for Policy Controller use?"
  options:
  - id: a
    text: "package sigstore and isCompliant"
    explanation: "Correct. Policy Controller uses sigstore and isCompliant."
  - id: b
    text: "package signature and allow"
    explanation: "Not correct. Policy Controller uses sigstore and isCompliant."
  - id: c
    text: "package main and deny"
    explanation: "Not correct. Policy Controller uses sigstore and isCompliant."
  - id: d
    text: "package policy and valid"
    explanation: "Not correct. Policy Controller uses sigstore and isCompliant."
  correct_option: a
  explanation: "Correct. Policy Controller uses sigstore and isCompliant."
- id: ats123-040-02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: "Rego package for cosign"
  source_readings:
  - sections/section-040/module-02/course-03-writing-rego-policies.md
  prompt: "Which package and rule does cosign verify-attestation --policy use for Rego?"
  options:
  - id: a
    text: "package signature and allow"
    explanation: "Correct. The cosign command uses signature and allow."
  - id: b
    text: "package sigstore and isCompliant"
    explanation: "Not correct. The cosign command uses signature and allow."
  - id: c
    text: "package main and deny"
    explanation: "Not correct. The cosign command uses signature and allow."
  - id: d
    text: "package policy and valid"
    explanation: "Not correct. The cosign command uses signature and allow."
  correct_option: a
  explanation: "Correct. The cosign command uses signature and allow."
- id: ats123-040-02-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: "Choose a language"
  source_readings:
  - sections/section-040/module-02/course-03-writing-rego-policies.md
  prompt: "For which task is Rego a better fit than CUE?"
  options:
  - id: a
    text: "Counting and comparing against lists of allowed values"
    explanation: "Correct. Rego computes, and CUE states requirements."
  - id: b
    text: "Checking that one field exists"
    explanation: "Not correct. Rego computes, and CUE states requirements."
  - id: c
    text: "Naming an entry"
    explanation: "Not correct. Rego computes, and CUE states requirements."
  - id: d
    text: "Reading a signature"
    explanation: "Not correct. Rego computes, and CUE states requirements."
  correct_option: a
  explanation: "Correct. Rego computes, and CUE states requirements."
- id: ats123-040-02-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: "Entries of one authority"
  source_readings:
  - sections/section-040/module-02/course-04-combining-attestations.md
  prompt: "An authority has two attestation entries. When does an image pass?"
  options:
  - id: a
    text: "When both entries pass"
    explanation: "Correct. Entries of one authority combine as AND."
  - id: b
    text: "When either entry passes"
    explanation: "Not correct. Entries of one authority combine as AND."
  - id: c
    text: "When the first passes"
    explanation: "Not correct. Entries of one authority combine as AND."
  - id: d
    text: "When no entry fails to parse"
    explanation: "Not correct. Entries of one authority combine as AND."
  correct_option: a
  explanation: "Correct. Entries of one authority combine as AND."
- id: ats123-040-02-q10
  type: single_choice
  difficulty: advanced
  learning_objective: "Combine rules"
  source_readings:
  - sections/section-040/module-02/course-04-combining-attestations.md
  prompt: "How do entries, authorities and policies combine?"
  options:
  - id: a
    text: "Entries AND, authorities OR, policies AND"
    explanation: "Correct. Entries and policies are all required. Authorities are alternatives."
  - id: b
    text: "Entries OR, authorities AND, policies OR"
    explanation: "Not correct. Entries and policies are all required. Authorities are alternatives."
  - id: c
    text: "All AND"
    explanation: "Not correct. Entries and policies are all required. Authorities are alternatives."
  - id: d
    text: "All OR"
    explanation: "Not correct. Entries and policies are all required. Authorities are alternatives."
  correct_option: a
  explanation: "Correct. Entries and policies are all required. Authorities are alternatives."
