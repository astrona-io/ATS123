# Split A Broad Policy By Team
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-123-lab-040-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tools"
      description: "Installs Helm 3.22.1, the lab registry, the workstation tools, the signing key and Policy Controller v0.15.1"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-123-lab-040-03-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Namespaces, the lab registry and the workstation pod."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation, the registry and the webhook answer"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-split-policies"
      description: "Confirms one policy per repository, each trusting exactly its own team key, and no policy covering both repositories"
      type: "file"
      source: "validation/validate-split-policies.sh"
    - name: "validate-split-admission"
      description: "Confirms prod admits the correctly signed inventory and tools images and refuses the unsigned and the cross-signed ones"
      type: "file"
      source: "validation/validate-split-admission.sh"
    - name: "validate-safe-settings"
      description: "Confirms the webhook still fails closed and images that match no policy are denied"
      type: "file"
      source: "validation/validate-safe-settings.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - registry:3.1.2
