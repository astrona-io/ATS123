# Key-Based Policies (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs its preparation, then stays running for
# free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-123-playground-020-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm, the lab registry, the workstation tools, the signing key and Policy Controller, then create the starting state."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "Namespaces, the lab registry and the workstation pod."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
