# Restore Enforcement After An Outage
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-123-capstone-010"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tools"
      description: "Installs Helm 3.22.1, the lab registry, the workstation tools, the signing key and Policy Controller v0.15.1"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-123-capstone-010-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Namespaces, the lab registry and the workstation pod."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation, the registry and the webhook answer"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-safe-settings"
      description: "Confirms the webhook still fails closed and images that match no policy are denied"
      type: "file"
      source: "validation/validate-safe-settings.sh"
    - name: "validate-prod-opted-in"
      description: "Confirms prod carries policy.sigstore.dev/include=true"
      type: "file"
      source: "validation/validate-prod-opted-in.sh"
    - name: "validate-prod-admission"
      description: "Confirms prod admits 6.15.0 and refuses the unsigned 6.14.1 and an image no policy matches"
      type: "file"
      source: "validation/validate-prod-admission.sh"
    - name: "validate-dev-not-enforced"
      description: "Confirms dev does not opt in and still admits an unsigned image"
      type: "file"
      source: "validation/validate-dev-not-enforced.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - registry:3.1.2
