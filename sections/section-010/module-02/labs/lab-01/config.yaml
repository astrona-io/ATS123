# Make A Setting Stick In The Helm Release
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-123-lab-010-02"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-tools"
      description: "Installs Helm 3.22.1, the lab registry, the workstation tools, the signing key and Policy Controller v0.15.1"
      type: "file"
      source: "bootstrap/01-install-tools.sh"
    - name: "ats-123-lab-010-02-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
  manifests:
    - name: "lab-start"
      description: "Namespaces, the lab registry and the workstation pod."
      type: "file"
      source: "manifests/lab-start.yaml"
testing:
  init:
    - name: "wait-for-workstation"
      description: "Waits until the workstation, the registry and the webhook answer"
      type: "file"
      source: "testing/wait-for-workstation.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-release-values"
      description: "Confirms the Helm release sets no-match-policy to deny and keeps its other values"
      type: "file"
      source: "validation/validate-release-values.sh"
    - name: "validate-configmap"
      description: "Confirms the ConfigMap config-policy-controller holds no-match-policy deny"
      type: "file"
      source: "validation/validate-configmap.sh"
    - name: "validate-unmatched-denied"
      description: "Confirms prod refuses an image that no policy matches and the webhook fails closed"
      type: "file"
      source: "validation/validate-unmatched-denied.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - registry:3.1.2
