# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats123-010
course_id: ATS123
exam_code: SIGSTORE
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-010
  title: How Policy Controller Works
placement:
  position: after
  reading: sections/section-010/capstone/labs/lab-01/question.md
questions:
- id: ats123-010-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what an admission webhook is
  source_readings:
  - sections/section-010/module-01/course-01-admission-webhooks-and-the-flow.md
  prompt: When does the Kubernetes API server call an admission webhook?
  options:
  - id: a
    text: Before it stores the object in etcd.
    explanation: Correct. Admission webhooks run before the object is saved.
  - id: b
    text: After the pod is running on a node.
    explanation: Not correct. Webhooks decide before storage, not after the pod starts.
  - id: c
    text: Only when the pod fails to start.
    explanation: Not correct. The API server calls the webhook on the write request,
      not on failure.
  - id: d
    text: Every time the kubelet reports pod status.
    explanation: Not correct. Status reports are not admission requests for new objects.
  correct_option: a
  explanation: Correct. Admission webhooks run before the object is saved.
- id: ats123-010-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Tell the two webhooks apart
  source_readings:
  - sections/section-010/module-01/course-01-admission-webhooks-and-the-flow.md
  prompt: What does the mutating webhook of Policy Controller do to a pod?
  options:
  - id: a
    text: It deletes images that have no signature from the registry.
    explanation: Not correct. Policy Controller never changes the registry.
  - id: b
    text: It replaces each image tag with the image digest.
    explanation: Correct. The pod then runs the same image that was checked.
  - id: c
    text: It signs the image with the lab key.
    explanation: Not correct. Signing is done by the signer with cosign, not by the
      webhook.
  - id: d
    text: It creates a ClusterImagePolicy for the image.
    explanation: Not correct. Policies are written by people, not generated by the
      webhook.
  correct_option: b
  explanation: Correct. The pod then runs the same image that was checked.
- id: ats123-010-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Tell the two webhooks apart
  source_readings:
  - sections/section-010/module-01/course-01-admission-webhooks-and-the-flow.md
  prompt: Which component checks signatures and attestations of an image?
  options:
  - id: a
    text: The mutating webhook `policy.sigstore.dev`.
    explanation: Not correct. The mutating webhook only resolves tags to digests.
  - id: b
    text: The schema validation step of the API server.
    explanation: Not correct. Schema validation checks the object format, not signatures.
  - id: c
    text: The validating webhook `policy.sigstore.dev`.
    explanation: Correct. It finds the matching policies and checks each image digest
      against them.
  - id: d
    text: The kubelet on the node.
    explanation: Not correct. The kubelet does not verify Sigstore signatures.
  correct_option: c
  explanation: Correct. It finds the matching policies and checks each image digest
    against them.
- id: ats123-010-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why a digest is used
  source_readings:
  - sections/section-010/module-01/course-01-admission-webhooks-and-the-flow.md
  prompt: Why does Policy Controller check an image by its digest and not by its tag?
  options:
  - id: a
    text: A digest is shorter than a tag and faster to compare.
    explanation: Not correct. The reason is identity, not length or speed.
  - id: b
    text: The registry refuses to store tags for signed images.
    explanation: Not correct. Registries store tags for signed images as usual.
  - id: c
    text: Tags are not allowed in pod specifications.
    explanation: Not correct. Pods may use tags. The webhook rewrites them.
  - id: d
    text: A tag can be moved to another image at any time, but a digest names exactly
      one image.
    explanation: Correct. The digest keeps the checked image and the started image
      the same.
  correct_option: d
  explanation: Correct. The digest keeps the checked image and the started image the
    same.
- id: ats123-010-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Use a server-side dry run
  source_readings:
  - sections/section-010/module-01/course-01-admission-webhooks-and-the-flow.md
  prompt: What does `kubectl run --dry-run=server` return when the webhooks are involved?
  options:
  - id: a
    text: A running pod with the image pulled to the node.
    explanation: Not correct. A dry run stores nothing and pulls nothing.
  - id: b
    text: Only a check of the YAML syntax on the client.
    explanation: Not correct. That is a client-side dry run. The server-side one calls
      the webhooks.
  - id: c
    text: The admission decision of the API server and its webhooks, without storing
      anything.
    explanation: Correct. It is a way to test a policy without starting a pod.
  - id: d
    text: The list of all ClusterImagePolicy resources.
    explanation: Not correct. A dry run is a decision on one object, not a listing.
  correct_option: c
  explanation: Correct. It is a way to test a policy without starting a pod.
- id: ats123-010-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Opt a namespace in
  source_readings:
  - sections/section-010/module-01/course-02-opting-in-and-failing-closed.md
  prompt: Which label makes Policy Controller check the pods of a namespace?
  options:
  - id: a
    text: "`policy.sigstore.dev/include=true`"
    explanation: Correct. The webhook namespace selector asks for exactly this label.
  - id: b
    text: "`policy.sigstore.dev/enabled=yes`"
    explanation: Not correct. The selector matches only the key `include` with the
      value `true`.
  - id: c
    text: "`cosign-system/enforce=true`"
    explanation: Not correct. This is not a label Policy Controller reads.
  - id: d
    text: "`pod-security.kubernetes.io/enforce=restricted`"
    explanation: Not correct. That label belongs to Pod Security Admission.
  correct_option: a
  explanation: Correct. The webhook namespace selector asks for exactly this label.
- id: ats123-010-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the no-match policy
  source_readings:
  - sections/section-010/module-01/course-02-opting-in-and-failing-closed.md
  prompt: In an opted-in namespace, a pod uses an image that no ClusterImagePolicy
    matches. What happens when `no-match-policy` is not set?
  options:
  - id: a
    text: Policy Controller admits the image silently.
    explanation: Not correct. Silent admission is the value `allow`, which is not
      the default.
  - id: b
    text: Policy Controller admits it with a warning.
    explanation: Not correct. A warning is the value `warn`, which is not the default.
  - id: c
    text: The API server asks the registry for a signature.
    explanation: Not correct. The API server does not contact the registry for this
      decision.
  - id: d
    text: Policy Controller denies the image.
    explanation: Correct. Deny is the default, so an unapproved image is refused.
  correct_option: d
  explanation: Correct. Deny is the default, so an unapproved image is refused.
- id: ats123-010-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain the failure policy
  source_readings:
  - sections/section-010/module-01/course-02-opting-in-and-failing-closed.md
  prompt: The webhook pods are down and the failure policy is `Fail`. What happens
    to a new pod in an opted-in namespace?
  options:
  - id: a
    text: The API server admits it as if the webhook said yes.
    explanation: Not correct. That is the behavior of `Ignore`.
  - id: b
    text: The API server refuses the request.
    explanation: Correct. Fail turns a webhook outage into refused pods, which is
      safe.
  - id: c
    text: The API server waits until the webhook is back and then continues.
    explanation: Not correct. The API server answers at once based on the failure
      policy.
  - id: d
    text: The pod is admitted only if its image has a digest.
    explanation: Not correct. The failure policy does not look at the image.
  correct_option: b
  explanation: Correct. Fail turns a webhook outage into refused pods, which is safe.
- id: ats123-010-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Find where the no-match policy is set
  source_readings:
  - sections/section-010/module-01/course-02-opting-in-and-failing-closed.md
  prompt: Where is the `no-match-policy` setting stored?
  options:
  - id: a
    text: In the ConfigMap `config-policy-controller` in the namespace `cosign-system`.
    explanation: Correct. Make lasting changes through the Helm value `webhook.configData`.
  - id: b
    text: In the label of each namespace.
    explanation: Not correct. Namespace labels only opt a namespace in.
  - id: c
    text: In every ClusterImagePolicy under `spec.mode`.
    explanation: Not correct. `mode` selects enforce or warn for one policy.
  - id: d
    text: In the validating webhook configuration as `failurePolicy`.
    explanation: Not correct. `failurePolicy` is a different setting.
  correct_option: a
  explanation: Correct. Make lasting changes through the Helm value `webhook.configData`.
- id: ats123-010-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Restore enforcement after an outage
  source_readings:
  - sections/section-010/capstone/labs/lab-01/question.md
  prompt: Which combination makes Policy Controller fail closed for `prod`?
  options:
  - id: a
    text: The `prod` label is set, `no-match-policy` is `allow`, and the failure policy
      is `Ignore`.
    explanation: Not correct. Both of these settings let unchecked images through.
  - id: b
    text: The `prod` label is removed, `no-match-policy` is `deny`, and the failure
      policy is `Fail`.
    explanation: Not correct. Without the label, the webhook never sees pods in `prod`.
  - id: c
    text: The `prod` label is set, `no-match-policy` is `deny`, and the failure policy
      is `Fail`.
    explanation: Correct. Each setting closes one way around the policies.
  - id: d
    text: The `prod` label is set, `no-match-policy` is `warn`, and the failure policy
      is `Fail`.
    explanation: Not correct. Warn admits images that no policy matches.
  correct_option: c
  explanation: Correct. Each setting closes one way around the policies.
