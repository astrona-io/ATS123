# Final domain knowledge check across all four sections and their modules.
schema_version: 1
kind: question_bank
id: ats123-final
course_id: ATS123
exam_code: SIGSTORE
status: alpha
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: kubernetes-enforcement-policy-controller
  title: 'Sigstore: Kubernetes Enforcement With Policy Controller'
questions:
- id: ats123-final-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what an admission webhook is
  source_readings:
  - sections/section-010/module-01/course-01-admission-webhooks-and-the-flow.md
  prompt: When does the Kubernetes API server call an admission webhook?
  options:
  - id: a
    text: Before it stores the object in etcd.
    explanation: Correct. Admission webhooks run before the object is saved.
  - id: b
    text: After the pod is running on a node.
    explanation: Not correct. Webhooks decide before storage, not after the pod starts.
  - id: c
    text: Only when the pod fails to start.
    explanation: Not correct. The API server calls the webhook on the write request,
      not on failure.
  - id: d
    text: Every time the kubelet reports pod status.
    explanation: Not correct. Status reports are not admission requests for new objects.
  correct_option: a
  explanation: Correct. Admission webhooks run before the object is saved.
- id: ats123-final-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Opt a namespace in
  source_readings:
  - sections/section-010/module-01/course-02-opting-in-and-failing-closed.md
  prompt: Which label makes Policy Controller check the pods of a namespace?
  options:
  - id: a
    text: "`policy.sigstore.dev/include=true`"
    explanation: Correct. The webhook namespace selector asks for exactly this label.
  - id: b
    text: "`policy.sigstore.dev/enabled=yes`"
    explanation: Not correct. The selector matches only the key `include` with the
      value `true`.
  - id: c
    text: "`cosign-system/enforce=true`"
    explanation: Not correct. This is not a label Policy Controller reads.
  - id: d
    text: "`pod-security.kubernetes.io/enforce=restricted`"
    explanation: Not correct. That label belongs to Pod Security Admission.
  correct_option: a
  explanation: Correct. The webhook namespace selector asks for exactly this label.
- id: ats123-final-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Restore enforcement after an outage
  source_readings:
  - sections/section-010/capstone/labs/lab-01/question.md
  prompt: Which combination makes Policy Controller fail closed for `prod`?
  options:
  - id: a
    text: The `prod` label is set, `no-match-policy` is `allow`, and the failure policy
      is `Ignore`.
    explanation: Not correct. Both of these settings let unchecked images through.
  - id: b
    text: The `prod` label is removed, `no-match-policy` is `deny`, and the failure
      policy is `Fail`.
    explanation: Not correct. Without the label, the webhook never sees pods in `prod`.
  - id: c
    text: The `prod` label is set, `no-match-policy` is `deny`, and the failure policy
      is `Fail`.
    explanation: Correct. Each setting closes one way around the policies.
  - id: d
    text: The `prod` label is set, `no-match-policy` is `warn`, and the failure policy
      is `Fail`.
    explanation: Not correct. Warn admits images that no policy matches.
  correct_option: c
  explanation: Correct. Each setting closes one way around the policies.
- id: ats123-final-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Sign an image with cosign
  source_readings:
  - sections/section-020/module-01/course-01-signing-for-the-cluster.md
  prompt: What does cosign sign when you give it an image tag?
  options:
  - id: a
    text: The tag name itself.
    explanation: Not correct. Tags are not signed. The digest is.
  - id: b
    text: The digest the tag points to at that moment.
    explanation: Correct. The signature belongs to the digest, not to the tag name.
  - id: c
    text: Every image in the repository.
    explanation: Not correct. One signing command signs one digest.
  - id: d
    text: The registry manifest list of all tags.
    explanation: Not correct. Cosign signs one image digest.
  correct_option: b
  explanation: Correct. The signature belongs to the digest, not to the tag name.
- id: ats123-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Match a glob
  source_readings:
  - sections/section-020/module-01/course-02-key-authorities.md
  prompt: Images are named `registry.localtest.me:5001/inventory/podinfo`. Which glob
    matches them?
  options:
  - id: a
    text: "`registry.localtest.me/inventory/**`"
    explanation: Not correct. The port `:5001` is missing, so nothing matches.
  - id: b
    text: "`registry.localtest.me:5001/inventory/*`"
    explanation: Not correct. A single `*` does not match `/`, so deeper repositories
      are missed.
  - id: c
    text: "`inventory/**`"
    explanation: Not correct. The glob is matched against the full image name including
      the registry.
  - id: d
    text: "`registry.localtest.me:5001/inventory/**`"
    explanation: Correct. The registry name with its port must match exactly, and
      `**` covers every repository below it.
  correct_option: d
  explanation: Correct. The registry name with its port must match exactly, and `**`
    covers every repository below it.
- id: ats123-final-q06
  type: single_choice
  difficulty: advanced
  learning_objective: Repair a key policy
  source_readings:
  - sections/section-020/capstone/labs/lab-01/question.md
  prompt: 'A `static` authority with `action: pass` is added to a key policy. What
    is the effect?'
  options:
  - id: a
    text: Every image passes the policy, so the key check means nothing.
    explanation: Correct. An authority that always passes makes the others useless.
  - id: b
    text: Only images signed with the key pass.
    explanation: Not correct. The static authority accepts images with no signature
      too.
  - id: c
    text: Every image is refused.
    explanation: Not correct. The action is `pass`.
  - id: d
    text: The policy switches to warn mode.
    explanation: Not correct. The mode is a separate field.
  correct_option: a
  explanation: Correct. An authority that always passes makes the others useless.
- id: ats123-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Explain keyless signing
  source_readings:
  - sections/section-030/module-01/course-01-keyless-signatures-and-identities.md
  prompt: What is the role of Fulcio in keyless signing?
  options:
  - id: a
    text: It stores the signature and the certificate in a transparency log.
    explanation: Not correct. That is Rekor.
  - id: b
    text: It issues the OIDC identity token.
    explanation: Not correct. The identity provider, such as GitHub, issues the token.
  - id: c
    text: It checks the identity token and issues a short-lived certificate for the
      new public key.
    explanation: Correct. Fulcio is the certificate authority of Sigstore.
  - id: d
    text: It stores the image in the registry.
    explanation: Not correct. The registry stores images.
  correct_option: c
  explanation: Correct. Fulcio is the certificate authority of Sigstore.
- id: ats123-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Write an identity
  source_readings:
  - sections/section-030/module-01/course-02-keyless-authorities.md
  prompt: In a keyless authority, why is the subject written as `subjectRegExp`?
  options:
  - id: a
    text: The subject is not allowed to be an exact string.
    explanation: Not correct. `subject` takes an exact string.
  - id: b
    text: The tag in the subject changes with every release.
    explanation: Correct. The expression matches any release tag.
  - id: c
    text: A regular expression is faster to check.
    explanation: Not correct. The reason is that the tag changes.
  - id: d
    text: Fulcio writes the subject as a regular expression.
    explanation: Not correct. Fulcio writes a plain URL.
  correct_option: b
  explanation: Correct. The expression matches any release tag.
- id: ats123-final-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Fix a keyless policy
  source_readings:
  - sections/section-030/capstone/labs/lab-01/question.md
  prompt: The glob of a keyless policy covers only `ghcr.io/stefanprodan/**`. What
    is the risk?
  options:
  - id: a
    text: Images of stefanprodan are refused.
    explanation: Not correct. They are covered by the glob.
  - id: b
    text: The policy stops checking the issuer.
    explanation: Not correct. The issuer is checked inside the authority.
  - id: c
    text: Other `ghcr.io` images fall through to the no-match policy, which may admit
      them.
    explanation: Correct. The glob should cover every image that must come from the
      workflow.
  - id: d
    text: The webhook is switched to `Ignore`.
    explanation: Not correct. The failure policy is a separate setting.
  correct_option: c
  explanation: Correct. The glob should cover every image that must come from the
    workflow.
- id: ats123-final-q10
  type: single_choice
  difficulty: beginner
  learning_objective: Explain attestations
  source_readings:
  - sections/section-040/module-01/course-01-attestation-policies.md
  prompt: What are the three parts of an in-toto statement?
  options:
  - id: a
    text: A `key`, a `certificate` and a `signature`.
    explanation: Not correct. Those belong to the signature, not the statement.
  - id: b
    text: A `glob`, an `authority` and a `mode`.
    explanation: Not correct. Those are fields of a ClusterImagePolicy.
  - id: c
    text: An `issuer`, a `subject` and an `identity`.
    explanation: Not correct. Those describe a keyless certificate.
  - id: d
    text: A `subject`, a `predicateType` and a `predicate`.
    explanation: Correct. The subject is the image digest and the predicate is the
      statement.
  correct_option: d
  explanation: Correct. The subject is the image digest and the predicate is the statement.
- id: ats123-final-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Write a Rego policy
  source_readings:
  - sections/section-040/module-01/course-02-rolling-out-and-debugging.md
  prompt: What must a Rego policy for Policy Controller make true?
  options:
  - id: a
    text: The rule `allow` in the package `main`.
    explanation: Not correct. Policy Controller reads `isCompliant` in `sigstore`.
  - id: b
    text: The rule `deny` with a message.
    explanation: Not correct. Policy Controller does not use a deny rule.
  - id: c
    text: The rule `isCompliant` in the package `sigstore`.
    explanation: Correct. The verified statement is available as `input`.
  - id: d
    text: A CUE value named `isCompliant`.
    explanation: Not correct. That is the Rego form, not CUE.
  correct_option: c
  explanation: Correct. The verified statement is available as `input`.
- id: ats123-final-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Fix a policy that never matches
  source_readings:
  - sections/section-040/capstone/labs/lab-01/question.md
  prompt: "`inventory-vulns` warns on every image, including a clean one. Which cause
    fits?"
  options:
  - id: a
    text: The policy is in enforce mode.
    explanation: Not correct. In enforce mode it would refuse, not warn.
  - id: b
    text: The `predicateType` of the attestation entry does not match the type of
      the attestations.
    explanation: Correct. A policy that never finds its attestation fails every image.
  - id: c
    text: The namespace has no label.
    explanation: Not correct. Without the label there would be no warnings.
  - id: d
    text: The images are not signed with the lab key.
    explanation: Not correct. The signatures are valid. The attestation type is the
      problem.
  correct_option: b
  explanation: Correct. A policy that never finds its attestation fails every image.
- id: ats123-final-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: "Make a change last"
  source_readings:
  - sections/section-010/module-02/course-02-chart-values-and-configuration-data.md
  prompt: "What makes a change to a setting last across upgrades?"
  options:
  - id: a
    text: "Set it through helm upgrade with --reuse-values and --set-string"
    explanation: "Correct. A change through the release is kept. A hand edit of the ConfigMap is overwritten at the next upgrade."
  - id: b
    text: "Edit the ConfigMap with kubectl edit"
    explanation: "Not correct. A change through the release is kept. A hand edit of the ConfigMap is overwritten at the next upgrade."
  - id: c
    text: "Delete the webhook pod"
    explanation: "Not correct. A change through the release is kept. A hand edit of the ConfigMap is overwritten at the next upgrade."
  - id: d
    text: "Add a label to the namespace"
    explanation: "Not correct. A change through the release is kept. A hand edit of the ConfigMap is overwritten at the next upgrade."
  correct_option: a
  explanation: "Correct. A change through the release is kept. A hand edit of the ConfigMap is overwritten at the next upgrade."
- id: ats123-final-q14
  type: single_choice
  difficulty: advanced
  learning_objective: "Operate the webhook safely"
  source_readings:
  - sections/section-010/module-02/course-04-upgrades-availability-and-removal.md
  prompt: "Why should you run more than one replica of the webhook?"
  options:
  - id: a
    text: "With failure policy Fail, one unavailable webhook blocks deployments in opted-in namespaces"
    explanation: "Correct. The failure policy Fail refuses requests when the webhook cannot answer, so its availability is the availability of deployments."
  - id: b
    text: "It makes signatures larger"
    explanation: "Not correct. The failure policy Fail refuses requests when the webhook cannot answer, so its availability is the availability of deployments."
  - id: c
    text: "It is required to read ConfigMaps"
    explanation: "Not correct. The failure policy Fail refuses requests when the webhook cannot answer, so its availability is the availability of deployments."
  - id: d
    text: "It lets the chart skip the TrustRoot"
    explanation: "Not correct. The failure policy Fail refuses requests when the webhook cannot answer, so its availability is the availability of deployments."
  correct_option: a
  explanation: "Correct. The failure policy Fail refuses requests when the webhook cannot answer, so its availability is the availability of deployments."
- id: ats123-final-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: "Use a catch-all that refuses"
  source_readings:
  - sections/section-020/module-02/course-02-several-authorities-and-policies.md
  prompt: "What does a catch-all policy with a static authority of action fail give you?"
  options:
  - id: a
    text: "A refusal that names the policy for registries you want blocked"
    explanation: "Correct. The error names the policy, which is clearer than the no-match policy message."
  - id: b
    text: "Faster admission for signed images"
    explanation: "Not correct. The error names the policy, which is clearer than the no-match policy message."
  - id: c
    text: "Automatic key rotation"
    explanation: "Not correct. The error names the policy, which is clearer than the no-match policy message."
  - id: d
    text: "A warning instead of a refusal"
    explanation: "Not correct. The error names the policy, which is clearer than the no-match policy message."
  correct_option: a
  explanation: "Correct. The error names the policy, which is clearer than the no-match policy message."
- id: ats123-final-q16
  type: single_choice
  difficulty: advanced
  learning_objective: "Scope of match"
  source_readings:
  - sections/section-020/module-02/course-04-limiting-a-policy-to-some-resources.md
  prompt: "What is the match field of a ClusterImagePolicy for?"
  options:
  - id: a
    text: "Limiting the policy to resource kinds and labels"
    explanation: "Correct. match narrows what the policy applies to. Objects it leaves out fall to the no-match policy, so it is not a security boundary."
  - id: b
    text: "Selecting the signing key"
    explanation: "Not correct. match narrows what the policy applies to. Objects it leaves out fall to the no-match policy, so it is not a security boundary."
  - id: c
    text: "Setting the failure policy"
    explanation: "Not correct. match narrows what the policy applies to. Objects it leaves out fall to the no-match policy, so it is not a security boundary."
  - id: d
    text: "Choosing the Rekor log"
    explanation: "Not correct. match narrows what the policy applies to. Objects it leaves out fall to the no-match policy, so it is not a security boundary."
  correct_option: a
  explanation: "Correct. match narrows what the policy applies to. Objects it leaves out fall to the no-match policy, so it is not a security boundary."
- id: ats123-final-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: "Several identities"
  source_readings:
  - sections/section-030/module-02/course-02-several-identities-and-authorities.md
  prompt: "When can one keyless authority list several identities?"
  options:
  - id: a
    text: "When they share one Fulcio and one set of logs"
    explanation: "Correct. Several identities share trust. Use several authorities when the trust differs."
  - id: b
    text: "When they use different Fulcio instances"
    explanation: "Not correct. Several identities share trust. Use several authorities when the trust differs."
  - id: c
    text: "When they use different keys"
    explanation: "Not correct. Several identities share trust. Use several authorities when the trust differs."
  - id: d
    text: "Never"
    explanation: "Not correct. Several identities share trust. Use several authorities when the trust differs."
  correct_option: a
  explanation: "Correct. Several identities share trust. Use several authorities when the trust differs."
- id: ats123-final-q18
  type: single_choice
  difficulty: advanced
  learning_objective: "Describe a private Sigstore"
  source_readings:
  - sections/section-030/module-02/course-04-trust-roots-for-a-private-sigstore.md
  prompt: "Which resource describes the trust of a private Sigstore?"
  options:
  - id: a
    text: "TrustRoot"
    explanation: "Correct. A TrustRoot holds the TUF root or the keys, and authorities point to it with trustRootRef."
  - id: b
    text: "ConfigMap"
    explanation: "Not correct. A TrustRoot holds the TUF root or the keys, and authorities point to it with trustRootRef."
  - id: c
    text: "ServiceAccount"
    explanation: "Not correct. A TrustRoot holds the TUF root or the keys, and authorities point to it with trustRootRef."
  - id: d
    text: "Secret of type tls"
    explanation: "Not correct. A TrustRoot holds the TUF root or the keys, and authorities point to it with trustRootRef."
  correct_option: a
  explanation: "Correct. A TrustRoot holds the TUF root or the keys, and authorities point to it with trustRootRef."
- id: ats123-final-q19
  type: single_choice
  difficulty: beginner
  learning_objective: "Use CUE for requirements"
  source_readings:
  - sections/section-040/module-02/course-02-writing-cue-policies.md
  prompt: "How does CUE treat fields that the policy does not mention?"
  options:
  - id: a
    text: "It ignores them"
    explanation: "Correct. CUE states what must be present."
  - id: b
    text: "It refuses the image"
    explanation: "Not correct. CUE states what must be present."
  - id: c
    text: "It deletes them"
    explanation: "Not correct. CUE states what must be present."
  - id: d
    text: "It requires them to be empty"
    explanation: "Not correct. CUE states what must be present."
  correct_option: a
  explanation: "Correct. CUE states what must be present."
- id: ats123-final-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: "Entries of one authority"
  source_readings:
  - sections/section-040/module-02/course-04-combining-attestations.md
  prompt: "An authority has two attestation entries. When does an image pass?"
  options:
  - id: a
    text: "When both entries pass"
    explanation: "Correct. Entries of one authority combine as AND."
  - id: b
    text: "When either entry passes"
    explanation: "Not correct. Entries of one authority combine as AND."
  - id: c
    text: "When the first passes"
    explanation: "Not correct. Entries of one authority combine as AND."
  - id: d
    text: "When no entry fails to parse"
    explanation: "Not correct. Entries of one authority combine as AND."
  correct_option: a
  explanation: "Correct. Entries of one authority combine as AND."
- id: ats123-final-q21
  type: single_choice
  difficulty: intermediate
  learning_objective: "Test cross-team use"
  source_readings:
  - sections/section-040/module-03/course-01-splitting-policies-by-owner.md
  prompt: "Which test proves that the split works?"
  options:
  - id: a
    text: "A team's key must not be accepted in another team's repository"
    explanation: "Correct. The point is that keys no longer work outside their prefix."
  - id: b
    text: "All images pass"
    explanation: "Not correct. The point is that keys no longer work outside their prefix."
  - id: c
    text: "No image passes"
    explanation: "Not correct. The point is that keys no longer work outside their prefix."
  - id: d
    text: "The webhook restarts"
    explanation: "Not correct. The point is that keys no longer work outside their prefix."
  correct_option: a
  explanation: "Correct. The point is that keys no longer work outside their prefix."
- id: ats123-final-q22
  type: single_choice
  difficulty: advanced
  learning_objective: "Availability"
  source_readings:
  - sections/section-040/module-03/course-04-monitoring-the-webhook.md
  prompt: "Why does the webhook need a disruption budget?"
  options:
  - id: a
    text: "Voluntary disruptions must not take all replicas down"
    explanation: "Correct. With failure policy Fail, no replicas means refused deployments."
  - id: b
    text: "It speeds up verification"
    explanation: "Not correct. With failure policy Fail, no replicas means refused deployments."
  - id: c
    text: "It rotates keys"
    explanation: "Not correct. With failure policy Fail, no replicas means refused deployments."
  - id: d
    text: "It stores policies"
    explanation: "Not correct. With failure policy Fail, no replicas means refused deployments."
  correct_option: a
  explanation: "Correct. With failure policy Fail, no replicas means refused deployments."
