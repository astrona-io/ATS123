        resources:
          - name: "Policy Controller overview"
            url: https://docs.sigstore.dev/policy-controller/overview/
          - name: "OIDC verification cheat sheet"
            url: https://docs.sigstore.dev/quickstart/verification-cheat-sheet/

  - id: module-040
    title: "Attestation Policies And Rollout"
    description: >
