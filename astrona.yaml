        path: sections/section-030/capstone/labs/lab-01/question.md
      - type: lab
        title: "Fix A Keyless Policy That Trusts Too Much Capstone"
        path: sections/section-030/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 30m
        topic: keyless-policy
        task_kind: troubleshooting
        tags: [keyless-authority, identity, image-glob, warn-mode, no-match-policy, dry-run]
