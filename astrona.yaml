        path: sections/section-030/module-01/course-02-keyless-authorities.md
      - type: reading
        title: Question
        path: sections/section-030/module-01/labs/lab-01/question.md
      - type: lab
        title: "Require Images Signed By The podinfo Release Workflow Lab"
        path: sections/section-030/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: keyless-policy
        task_kind: build
        tags: [clusterimagepolicy, keyless-authority, identity, fulcio, rekor, dry-run]
        learning_goals:
          - Read the issuer and subject of a keyless signature with cosign verify
          - Write a keyless policy that trusts only one repository's release workflow
          - Prove that an image signed by another repository's workflow is refused
        resources:
          - name: "Policy Controller: configuring keyless authorities"
